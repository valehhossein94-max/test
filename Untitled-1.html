<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram UI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Tahoma, Arial, sans-serif;
}

body {
    background: #dfe5e8;
    height: 100vh;
    overflow: hidden;
}

.app {
    width: 100%;
    height: 100vh;
    display: flex;
    background: white;
}

/* Sidebar */
.sidebar {
    width: 350px;
    background: #fff;
    border-left: 1px solid #ddd;
    display: flex;
    flex-direction: column;
}

.header {
    height: 65px;
    background: #5682a3;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 15px;
    gap: 15px;
}

.menu {
    font-size: 25px;
    cursor: pointer;
}

.title {
    font-size: 20px;
    font-weight: bold;
}

.search {
    padding: 10px;
    background: #f5f5f5;
}

.search input {
    width: 100%;
    border: none;
    outline: none;
    background: #e6e6e6;
    padding: 12px 15px;
    border-radius: 20px;
    font-size: 14px;
}

/* Chat List */
.chat-list {
    flex: 1;
    overflow-y: auto;
}

.chat {
    display: flex;
    align-items: center;
    padding: 12px;
    cursor: pointer;
    border-bottom: 1px solid #eee;
    transition: .2s;
}

.chat:hover {
    background: #f1f1f1;
}

.chat.active {
    background: #e6eef5;
}

.avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #5682a3;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 21px;
    margin-left: 12px;
    flex-shrink: 0;
}

.chat-info {
    flex: 1;
    min-width: 0;
}

.chat-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 7px;
}

.name {
    font-weight: bold;
    font-size: 15px;
}

.time {
    color: #999;
    font-size: 11px;
}

.last-message {
    color: #888;
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Main Chat */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: #e5ddd5;
    position: relative;
}

.chat-header {
    height: 65px;
    background: #5682a3;
    color: white;
    display: flex;
    align-items: center;
    padding: 8px 18px;
}

.chat-avatar {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #fff;
    color: #5682a3;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: 12px;
    font-size: 18px;
}

.user-name {
    font-weight: bold;
}

.status {
    font-size: 12px;
    opacity: .8;
    margin-top: 5px;
}

/* Messages */
.messages {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.message {
    max-width: 65%;
    padding: 9px 13px;
    border-radius: 10px;
    position: relative;
    font-size: 14px;
    line-height: 1.7;
    box-shadow: 0 1px 1px rgba(0,0,0,.1);
}

.received {
    background: white;
    align-self: flex-start;
    border-top-right-radius: 2px;
}

.sent {
    background: #dcf8c6;
    align-self: flex-end;
    border-top-left-radius: 2px;
}

.message-time {
    font-size: 10px;
    color: #888;
    margin-right: 8px;
    float: left;
    margin-top: 5px;
}

/* Input */
.input-area {
    min-height: 65px;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    padding: 10px 15px;
    gap: 10px;
}

.input-area input {
    flex: 1;
    border: none;
    outline: none;
    padding: 13px 18px;
    border-radius: 25px;
    font-size: 14px;
    background: white;
}

.send-btn {
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 50%;
    background: #5682a3;
    color: white;
    font-size: 20px;
    cursor: pointer;
    transition: .2s;
}

.send-btn:hover {
    background: #416d8c;
    transform: scale(1.05);
}

/* Mobile */
@media (max-width: 700px) {

    .sidebar {
        width: 100%;
    }

    .main {
        display: none;
    }

    .sidebar.mobile-hide {
        display: none;
    }

    .main.mobile-show {
        display: flex;
        width: 100%;
    }

    .back {
        display: block !important;
    }
}

.back {
    display: none;
    font-size: 22px;
    cursor: pointer;
    margin-left: 10px;
}
</style>
</head>

<body>

<div class="app">

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">

        <div class="header">
            <div class="menu">☰</div>
            <div class="title">Telegram</div>
        </div>

        <div class="search">
            <input
                type="text"
                id="search"
                placeholder="جستجو..."
                onkeyup="searchChats()"
            >
        </div>

        <div class="chat-list" id="chatList">

            <div class="chat active" onclick="openChat('علی','ع')">
                <div class="avatar">ع</div>

                <div class="chat-info">
                    <div class="chat-top">
                        <span class="name">علی</span>
                        <span class="time">16:42</span>
                    </div>

                    <div class="last-message">
                        سلام داداش خوبی؟
                    </div>
                </div>
            </div>

            <div class="chat" onclick="openChat('محمد','م')">
                <div class="avatar" style="background:#e67e22">م</div>

                <div class="chat-info">
                    <div class="chat-top">
                        <span class="name">محمد</span>
                        <span class="time">15:30</span>
                    </div>

                    <div class="last-message">
                        فردا میای؟
                    </div>
                </div>
            </div>

            <div class="chat" onclick="openChat('رضا','ر')">
                <div class="avatar" style="background:#8e44ad">ر</div>

                <div class="chat-info">
                    <div class="chat-top">
                        <span class="name">رضا</span>
                        <span class="time">13:10</span>
                    </div>

                    <div class="last-message">
                        فایل رو فرستادم
                    </div>
                </div>
            </div>

            <div class="chat" onclick="openChat('گروه دوستان','👥')">
                <div class="avatar" style="background:#27ae60">👥</div>

                <div class="chat-info">
                    <div class="chat-top">
                        <span class="name">گروه دوستان</span>
                        <span class="time">12:05</span>
                    </div>

                    <div class="last-message">
                        سجاد: امشب بریم بیرون؟
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Main -->
    <div class="main" id="main">

        <div class="chat-header">

            <div class="back" onclick="backToChats()">←</div>

            <div class="chat-avatar" id="chatAvatar">ع</div>

            <div>
                <div class="user-name" id="userName">علی</div>
                <div class="status">آنلاین</div>
            </div>

        </div>

        <div class="messages" id="messages">

            <div class="message received">
                سلام داداش 👋
                <span class="message-time">16:40</span>
            </div>

            <div class="message sent">
                سلام ❤️ خوبی؟
                <span class="message-time">16:41</span>
            </div>

            <div class="message received">
                مرسی، تو خوبی؟
                <span class="message-time">16:42</span>
            </div>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="پیام..."
                onkeydown="handleEnter(event)"
            >

            <button class="send-btn" onclick="sendMessage()">
                ➤
            </button>

        </div>

    </div>

</div>


<script>

function sendMessage() {

    const input = document.getElementById("messageInput");
    const text = input.value.trim();

    if (text === "") return;

    const messages = document.getElementById("messages");

    const message = document.createElement("div");

    message.className = "message sent";

    message.innerHTML = `
        ${escapeHTML(text)}
        <span class="message-time">
            ${getTime()}
        </span>
    `;

    messages.appendChild(message);

    input.value = "";

    messages.scrollTop = messages.scrollHeight;
}


function handleEnter(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

}


function getTime() {

    const date = new Date();

    return date.toLocaleTimeString("fa-IR", {
        hour: "2-digit",
        minute: "2-digit"
    });

}


function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


function openChat(name, avatar) {

    document.getElementById("userName").textContent = name;
    document.getElementById("chatAvatar").textContent = avatar;

    // در موبایل صفحه چت نمایش داده شود
    if (window.innerWidth <= 700) {

        document.getElementById("sidebar")
            .classList.add("mobile-hide");

        document.getElementById("main")
            .classList.add("mobile-show");

    }

}


function backToChats() {

    document.getElementById("sidebar")
        .classList.remove("mobile-hide");

    document.getElementById("main")
        .classList.remove("mobile-show");

}


function searchChats() {

    const input = document
        .getElementById("search")
        .value
        .toLowerCase();

    const chats = document.querySelectorAll(".chat");

    chats.forEach(chat => {

        const name = chat
            .querySelector(".name")
            .textContent
            .toLowerCase();

        if (name.includes(input)) {
            chat.style.display = "flex";
        } else {
            chat.style.display = "none";
        }

    });

}

</script>

</body>
